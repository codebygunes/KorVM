name: KorVM Core CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-chaos-and-parser:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install hypothesis

    - name: Run W3C Parser & Real-World Chaos Test
      run: |
        python tests/integration/test_impossible_real_world_chaos.py

    - name: Run Unit & JIT Tests
      run: |
        python tests/unit/test_interpreter.py
        python tests/unit/test_jit.py