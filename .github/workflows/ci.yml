name: KorVM Core CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-python-and-rust:
    name: Multi-Language Core Testing
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install hypothesis

    - name: Run Python JIT & W3C Parser Chaos Tests
      run: |
        python tests/integration/test_impossible_real_world_chaos.py

    - name: Set up Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Run Rust Core "Impossible" Chaos Tests
      working-directory: ./core_engine
      run: |
        cargo test --verbose