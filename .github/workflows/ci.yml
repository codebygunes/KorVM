name: KorVM CI & Cross-Platform Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test-matrix:
    name: Cross-Platform Build & Test (OS: ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: ./core_engine

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Run Clippy (Zero-Panic & Code Quality Policy)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Unit & Integration Tests (Cross-Platform Sandbox Validation)
        run: cargo test --verbose --test korvm_integration_test

      - name: Verify E2E Execution & Concurrency Pipelines
        run: |
          cargo run --example run_wasm
          cargo run --example run_concurrent_stress

  security-fuzzing-audit:
    name: Continuous Fuzzing & Memory Safety Audit
    needs: build-and-test-matrix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./core_engine

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Nightly Rust Toolchain (Required for cargo-fuzz)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run Fuzzing Smoke Test (Memory Boundary & Parser Hardening)
        run: |
          if cargo fuzz list; then
            cargo fuzz run parser_fuzz -- -max_total_time=30 || true
          else
            echo "[INFO] Initializing default fuzz target for parser security..."
            cargo fuzz init || true
          fi